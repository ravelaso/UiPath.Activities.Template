name: Publish Nuget Template

on:
  push:
    branches: [ "master" ]
  pull_request:
    types:
      - closed
    branches: ["master"]

jobs:
  if_merged:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.x'

      - name: Configure NuGet sources
        run: |
          dotnet nuget add source https://pkgs.dev.azure.com/uipath/Public.Feeds/_packaging/UiPath-Official/nuget/v3/index.json -n UiPath-Official

      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build project
        run: dotnet build --configuration Release

      - name: Pack project
        run: nuget pack Ravelaso.UiPath.Template.nuspec -version 1.1.1

      - name: Publish package
        run: nuget push Output/Activities/Packages/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ secrets.NUGET_API_KEY }}